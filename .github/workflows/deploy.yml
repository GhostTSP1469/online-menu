name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Сервер не настроен
        if: env.VPS_HOST == ''
        run: echo "::notice::Секреты VPS_HOST, VPS_USER, VPS_SSH_KEY не заданы. Проверка прошла, деплой пропущен."
      - name: Деплой на VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.APP_DIR || '~/online-menu' }}"
            git pull --ff-only origin main
            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
