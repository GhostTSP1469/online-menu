services:
  - type: web
    name: online-menu
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/menu
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NUXT_TG_TOKEN
        sync: false
      - key: NUXT_TG_PHONES
        sync: false
      - key: NUXT_TG_CHAT
        sync: false
      - key: NUXT_ADMIN_LOGIN
        sync: false
      - key: NUXT_ADMIN_PASSWORD
        sync: false
      - key: NUXT_PUBLIC_SITE_URL
        sync: false
